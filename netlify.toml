# ============================================================================
# Stratemark landing — Netlify configuration
# Added 2026-08-27 security cleanup. No visual/behavior change to the site;
# this file only pins build behavior, adds security headers and CSP, and
# closes off internal files from public serving.
#
# CSP notes:
# - The site has exactly two inline scripts and two inline style blocks
#   (index.html and demo.html). They are allowlisted by SHA-256 hash —
#   no 'unsafe-inline', no 'unsafe-eval'. If either inline block is ever
#   edited, recompute its hash, e.g.:
#     node -e "const c=require('crypto'),f=require('fs');const h=f.readFileSync('index.html','utf8');const body=h.slice(h.indexOf('<script>')+8,h.indexOf('</script>'));console.log('sha256-'+c.createHash('sha256').update(body).digest('base64'))"
# - Netlify post-processing (pretty URLs) rewrites <a> attributes at deploy
#   time but does not touch inline script/style bodies, so the hashes below
#   match the served bytes.
# ============================================================================

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.html]
  # Matches the behavior the live site already ships (hrefs rewritten to
  # pretty URLs). Kept explicit so a redeploy with this file is reproducible.
  pretty_urls = true

# ---------------------------------------------------------------------------
# Global security headers + site-wide CSP
# ---------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'sha256-7AEUFiiD/PJ3lR9Dn5mVnuzGjtJqNk+o4j5aGw8L1Gc=' 'sha256-b3uY4/58xtVw5QnprgTAfhIGFJTy07dv9EaaUUK3rB0='; style-src 'self' 'sha256-rYP2pBMRhzyBlju42zw5U6dbHAF+QHaV6z6XyEXAqWQ=' 'sha256-dONZJ9wTPZMPWYeWbLg0AQiZ+kbLhLNbOdkfC10iqdQ=' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://generativelanguage.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://firebase.googleapis.com https://*.run.app; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"

# Long cache for static assets (images only; HTML must revalidate).
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ---------------------------------------------------------------------------
# Redirects
# ---------------------------------------------------------------------------

# Canonical home (pretty URLs are enabled; /index.html should not be a
# second address for the same page).
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# index-enhanced.html is an orphaned duplicate of index.html — no page links
# to it. Retired here; old links (and any shared URLs) land on the real page.
[[redirects]]
  from = "/index-enhanced.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/index-enhanced"
  to = "/"
  status = 301
  force = true

# Internal files were being served publicly. Block them.
[[redirects]]
  from = "/DEPLOY.md"
  to = "/"
  status = 403

[[redirects]]
  from = "/SWAP-POINTS.md"
  to = "/"
  status = 403

[[redirects]]
  from = "/firebase.json"
  to = "/"
  status = 403

[[redirects]]
  from = "/.21st/*"
  to = "/"
  status = 403

[[redirects]]
  from = "/docs/*"
  to = "/"
  status = 403
